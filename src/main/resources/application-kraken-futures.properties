# ========================================
# Kraken Futures profile — perpetual futures on port 8082
# Start: mvn spring-boot:run -Dspring-boot.run.profiles=kraken-futures
# ========================================

server.port=8082

# Separate H2 database from the crypto (Coinbase) process
spring.datasource.url=jdbc:h2:file:~/itark/froskH2DBKrakenFuturesFile;AUTO_SERVER=TRUE

# Securities are added by KrakenFuturesSecurityInitializer — no Coinbase API call needed
frosk.adddatasetandsecurities=false
# Kraken Futures uses its own price feed — disable Coinbase and Yahoo
frosk.addsecuritypricesfromcoinbase=false
frosk.addsecuritypricesfromyahoo=false
frosk.updatesecuritymetadata=false
frosk.runallstrategies=false
frosk.buildportfolio=false
frosk.updatehedgeindex=false
frosk.database.only=KRAKEN

frosk.run.omxs30swing=false
frosk.run.dagstrategin=false
frosk.run.manedsportfolj=false
frosk.run.intraday=true
frosk.run.crypto=true

# NOTE: frosk.strategies.crypto.exclude is intentionally NOT set here. That property
# is read only by StrategyAnalysis (the daily runAllStrategies pass, disabled on this
# profile). The 15m pipeline in CryptoIntradayStrategyRunner is governed by the
# crypto.*.enabled switches near the bottom of this file, not by that list.

# ── Scheduler ─────────────────────────────────────────────────────────────────
scheduler.tier0.cron=-
scheduler.tier1.cron=-
scheduler.tier2.cron=-
scheduler.tier3.cron=-
scheduler.crypto.cron=-
# 15m intraday cycle — same cadence as the Coinbase crypto process
scheduler.crypto.intraday.cron=0 */15 * * * *

frosk.newsdriven.rss.poll.enabled=false

# ── Kraken Futures products ────────────────────────────────────────────────────
# PF_ prefix = perpetual futures (USD-denominated, no expiry, funding every 8h).
# In the Kraken Pro GUI these show as "<base> Perpetual" under Futures, not Spot
# (XBT = Kraken's code for BTC).
#
# Two universes, same split as the Coinbase profile:
#   * crypto.intraday.products (below)  — the curated 15m whitelist. One charts
#     call per product per cycle + one ticker call per emitted signal. Keep small.
#   * kraken.futures.enumerate.instruments — when true, KrakenFuturesSecurityInitializer
#     registers EVERY tradeable crypto PF_ perpetual from /instruments as a KRAKEN
#     security (analogue of DataSetHelper.saveCoinbaseToRepo). Non-crypto instruments
#     (xStocks, Commodities, Forex, Stablecoin, Indices, Pre-IPO) are filtered by
#     category. These are screening/backtest universe only — not on the 15m cycle.
kraken.futures.enumerate.instruments=true

# Curated 15m whitelist — the 23 symbols from the Coinbase crypto.intraday.products
# list that have a direct PF_ perpetual on Kraken (XBT = BTC). Widen from here using
# the spread data in the signal log, not by pointing this at the full universe.
crypto.intraday.products=PF_XBTUSD,PF_ETHUSD,PF_SOLUSD,PF_ADAUSD,PF_XRPUSD,\
  PF_LTCUSD,PF_ATOMUSD,PF_AAVEUSD,PF_NEARUSD,PF_SUIUSD,PF_HBARUSD,PF_ICPUSD,\
  PF_XLMUSD,PF_XTZUSD,PF_CRVUSD,PF_BCHUSD,PF_TAOUSD,PF_WLDUSD,PF_ONDOUSD,\
  PF_PENGUUSD,PF_HYPEUSD,PF_DEGENUSD,PF_MONUSD

# Regime gate uses BTC as proxy (same SMA logic as Coinbase profile)
crypto.regime.product=PF_XBTUSD
crypto.regime.sma.period=50

# ── Kraken Futures API credentials ────────────────────────────────────────────
# Obtain from: https://futures.kraken.com → Settings → API Keys
#
# NOTE: the standalone demo (demo-futures.kraken.com) has been decommissioned —
# it now 301-redirects every path (derivatives API included) to a marketing page.
# We therefore point the derivatives API at the LIVE host. This is safe because:
#   * no real order is ever placed while crypto.live.trading.enabled=false (below)
#   * paper trading (KrakenFuturesPaperTradingService) is fully simulated in-process
#     and never calls this API
#   * only read calls (tickers/instruments/spread) hit the API in the current setup
kraken.futures.api.baseUrl=https://futures.kraken.com/derivatives/api/v3
# Separate base for OHLCV candles — same live host, public (no auth). The charts
# API is only served from the live host; demo-futures 301-redirects /api/charts.
kraken.futures.history.baseUrl=https://futures.kraken.com/api/charts/v1

# The key and secret are NOT stored here — this file is checked into git.
# They're loaded from a local, untracked file outside the repo:
#   ~/.frosk/kraken-credentials.properties
# See kraken-credentials.template.properties at the repo root for the format and
# setup steps. spring.config.import below pulls that file in when present; the
# "optional:" prefix means startup does not fail when it's missing (e.g. on a
# machine that only runs the other profiles). The defaults after ":" are used
# only when neither the file nor the KRAKEN_FUTURES_API_KEY/_SECRET env vars are
# set — enough for read-only endpoints to work, authenticated calls will just
# fail with a clear 401 instead of refusing to start.
spring.config.import=optional:file:${user.home}/.frosk/kraken-credentials.properties
kraken.futures.api.key=${KRAKEN_FUTURES_API_KEY:CHANGE_ME_SEE_kraken-credentials.template.properties}
kraken.futures.api.secret=${KRAKEN_FUTURES_API_SECRET:CHANGE_ME_SEE_kraken-credentials.template.properties}

# ── Live trading ───────────────────────────────────────────────────────────────
# Safety: OFF by default. Enable via POST /api/crypto/live-trading/enable
crypto.live.trading.enabled=false
# Position size: 5% of available collateral per trade, USD-denominated
crypto.live.trading.position.pct.of.equity=0.05
crypto.live.trading.position.min.eur=25
crypto.live.trading.max.position.eur=500
crypto.live.trading.max.daily.loss.eur=2000
crypto.live.trading.max.total.exposure.pct=0.5
crypto.signal.strength.elevated.multiplier=1.5
crypto.signal.strength.strong.multiplier=2.0

# ── Kraken Futures paper trading ──────────────────────────────────────────────
# Initial simulated collateral in USD (Kraken Futures accounts are USD-denominated)
kraken.futures.paper.init.collateral.usd=5000
# Position size: 5% of collateral per trade
kraken.futures.paper.position.pct.of.collateral=0.05
kraken.futures.paper.position.min.usd=25
kraken.futures.paper.position.max.usd=1000
# Maximum fraction of collateral deployed across all open positions
kraken.futures.paper.max.total.exposure.pct=0.5
# Taker fee per leg — Kraken Futures default for retail: 0.05%
# Adjust down if you have a higher volume tier (Kraken publishes tier thresholds)
kraken.futures.paper.taker.fee.pct=0.0005
# Funding rate per 8-hour period, signed from the long position's perspective.
# Positive = longs pay shorts (typical in bullish markets).
# Historical average for BTC perpetual ~0.01% per 8h in up-trending markets.
# Set to 0.0 to disable funding simulation for backtesting fee-only impact.
kraken.futures.paper.funding.rate.per.8h=0.0001

# ── Strategy switches (15m pipeline) ──────────────────────────────────────────
# Kraken Futures supports shorting natively, so the two short strategies actually
# execute here (paper + live) instead of only emitting review signals.
#   CryptoShort        — best gross edge in the whole dataset (+0.87%/trade)
#   CryptoEMACrossShort — no edge study; monitor, futures + funding may change it
# EMACrossLong and RangeBreakout stay off: negative GROSS edge on Coinbase data,
# and a lower fee tier cannot rescue a strategy that loses before fees.
crypto.short.enabled=true
crypto.emacrossshort.enabled=true
crypto.emacrosslong.enabled=false
crypto.breakout.enabled=false
# CryptoLiquiditySweep is OFF here: its product universe is locked by
# ~/itark/PREREG_liquidity_sweep_15m.md to the Coinbase crypto.intraday.products
# list. Running it on PF_* symbols would break the pre-registration.
crypto.sweep.enabled=false

# Spread logging: best-effort capture of bid/ask at signal time.
# For Kraken Futures the spread call goes to the /tickers/{symbol} endpoint.
crypto.spread.logging.enabled=true

# NOTE: no historical signal backfill here. intraday_signal accumulates one bar at a
# time from the live 15m loop — same principle as the Coinbase (:8081) process. The
# dashboard "Daily P&L" card therefore only shows days this instance has actually
# traded; that is intentional (a synthetic backtest replay is not a track record).

# ── Coinbase L2 capture — disabled (Kraken Futures process, not Coinbase) ──────
coinbase.l2.capture.enabled=false

# ── Stale position reconciliation ─────────────────────────────────────────────
# Same 120-bar (30h) force-close window as the Coinbase profile.
crypto.excluded.force.close.bars=120
