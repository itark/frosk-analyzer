# ========================================
# Crypto profile — Coinbase data on port 8081
# Start: mvn spring-boot:run -Dspring-boot.run.profiles=crypto
# ========================================

server.port=8081

# The crypto H2 file IS the main (and only) datasource for this process
spring.datasource.url=jdbc:h2:file:~/itark/froskH2DBCryptoFile;AUTO_SERVER=TRUE

frosk.adddatasetandsecurities=true
frosk.addsecuritypricesfromcoinbase=true
frosk.addsecuritypricesfromyahoo=false
frosk.updatesecuritymetadata=false
frosk.runallstrategies=true
# No daily portfolio on crypto — DAILY_STRATEGIES are equity strategies that
# don't run here. The intraday portfolio (built by syncCryptoIntraday) is separate.
frosk.buildportfolio=false
frosk.updatehedgeindex=false
frosk.database.only=COINBASE

frosk.run.omxs30swing=false
frosk.run.dagstrategin=false
frosk.run.manedsportfolj=false
frosk.run.intraday=true
frosk.run.crypto=true

# The crypto system is the 15m intraday pipeline (see the per-strategy enable
# switches further down for which of the five are actually live). NOTE: this
# exclude list applies ONLY to the daily runAllStrategies pass — the 15m pipeline
# in CryptoIntradayStrategyRunner is governed by crypto.*.enabled, not by this.
# The daily strategy run is disabled by excluding every
# strategy it would otherwise run — the equity-coupled ones never traded, and
# the price-pattern ones all lost money on daily Coinbase candles:
#   CANSLIMStrategy                            — needs EPS growth + 52-week (never traded)
#   HighLanderStrategy                         — needs HedgeIndex + Beta + PEG (never traded)
#   ShortTermMomentumLongTermStrengthStrategy  — HedgeIndex gate/exit inert on crypto (-6.4%)
#   EMATenTwentyStrategy                       — price-only, -12.2% on daily crypto
#   HaramiStrategy                             — price-only candlestick, -2.8%
#   RunawayGAPStrategy                         — price-only, -1.6%
#   EngulfingStrategy                          — price-only candlestick, -0.5%
# The daily Coinbase price sync still runs (CryptoRegimeService needs BTC daily closes).
frosk.strategies.crypto.exclude=CANSLIMStrategy,HighLanderStrategy,ShortTermMomentumLongTermStrengthStrategy,EMATenTwentyStrategy,HaramiStrategy,RunawayGAPStrategy,EngulfingStrategy,CryptoShortIntradayStrategy,CryptoEMACrossShortIntradayStrategy,CryptoBTCTrendStrategy

# Disable Yahoo-based schedulers (Tier 0-3 are not relevant for crypto)
scheduler.tier0.cron=-
scheduler.tier1.cron=-
scheduler.tier2.cron=-
scheduler.tier3.cron=-

# Nasdaq Nordic RSS is Swedish equity news — not relevant for the crypto process
frosk.newsdriven.rss.poll.enabled=false
# Crypto sync runs daily at 00:30
scheduler.crypto.cron=0 30 0 * * *
# Crypto intraday 15m candle sync — every 15 minutes, around the clock
scheduler.crypto.intraday.cron=0 */15 * * * *

# Selected 2026-08-03 on TICK FLOOR, not 24h volume. The floor is the smallest
# spread a product can physically have: quote_increment / price. It is structural
# (the increment is a venue product spec) and it is a hard cost — a market entry
# pays the ask, a market exit hits the bid, so a round trip gives up roughly one
# full spread on top of the 0.20% taker fee.
#
# 24 products were dropped because their floor ALONE exceeds the entire post-fee
# margin (gross edge ~0.29% - 0.20% fee = ~0.09% left). Worst offenders, all at a
# 1-tick spread with plenty of depth — coarse price grid, not thin liquidity:
#   NKN-USD 1.80%, MANA-EUR 1.74%, FIL-EUR 1.63%, DOT-EUR 1.44%, 1INCH-EUR 1.44%
# DOT-EUR trades near EUR 0.695 with a EUR 0.01 increment: it cannot round-trip
# for less than 1.44%, so no edge this strategy produces can survive it.
#
# WARNING — this filter removes provably impossible products; it does NOT make the
# strategy profitable. Measured on history, every threshold still nets negative
# once spread is charged (floor<0.02%: -0.115%/trade; floor<0.10%: -0.139%). The
# tight products carry a much lower gross edge (+0.09%) than the wide ones (+0.27%),
# because wide grids trigger the VWAP stretch more often and the close-price fill
# assumption flatters them. See crypto.spread.logging below — that data, not this
# one-off snapshot, is what should drive the next revision of this list.
crypto.intraday.products=AAVE-EUR,ADA-EUR,AERO-USD,ALLO-USD,ATOM-EUR,BAT-EUR,BCH-EUR,BILL-USD,BTC-EUR,CRV-EUR,DEGEN-USD,ETH-EUR,EURC-USDC,HBAR-USD,HYPE-USD,ICP-EUR,LIGHTER-USD,LSETH-USD,LTC-EUR,MON-USD,NEAR-USD,ONDO-USD,PENGU-USD,RE-USD,SOL-EUR,SUI-USD,TAO-USD,TOSHI-USD,TRAC-USD,USDC-EUR,USDT-EUR,VVV-USD,WLD-USD,XLM-EUR,XRP-EUR,XTZ-EUR,ZEC-USD

# Regime gate: SMA(50) filters more noise than SMA(20) on daily crypto closes
crypto.regime.sma.period=50

# CryptoVWAPReversionIntradayStrategy overrides. The 1.2% stretch is the gross
# profit target; against the current 0.20% taker round trip it leaves ~1.0% net.
# Measured gross edge at this setting: +0.408%/trade over 79 trades (Aug 2026).
# Half-day hold limit (48→24) keeps reversion trades tight.
# NOTE: 5m bar granularity for VWAP requires a separate data pipeline and is not
# a config change — the current pipeline is hardcoded to 15m Coinbase candles.
crypto.vwap.stretch.pct=1.2
crypto.vwap.max.bars.held=24
crypto.vwap.rsi.period=7
crypto.vwap.rsi.entry=35.0
# Cooldown after a losing exit (CooldownAfterLossRule). 2026-10-07 review of 1373 paper
# trades: re-entries within 30 min of a loss lost -0.34 EUR/trade vs +0.13 baseline;
# the effect is gone by 2h, so keep this short. 2 bars ≈ 45 min after the exit signal.
crypto.vwap.cooldown.bars.after.loss=2
# Per-ticker trend filter: enter only while SMA(96) (24h) is above its value 24 bars
# (6h) ago. Re-introduces a regime gate (GARCH+ADX was removed 2026-09-17) using the
# ticker's own trend — a BTC proxy pointed the wrong way. In-sample over 27 days
# (2026-09-08..10-06): validate with StrategyComparisonReportIT.
crypto.vwap.trend.filter.enabled=true
crypto.vwap.trend.sma.bars=96
crypto.vwap.trend.slope.bars=24
# UTC entry window (TimeWindowRule, 2026-10-16): entries only while the signal bar's
# end time is in [start, end) UTC. From external BTC seasonality research (21-23 UTC).
# NOTE: H1 in ~/itark/PREREG_vwap_signal_filters.md tested 21-22 UTC on 400 days of
# VWAP replay and did not recommend it (halves of opposite sign), and with this on the
# paper record has no out-of-window entries left for PREREG_vwap_seasonality_window.md.
crypto.vwap.time.window.enabled=true
crypto.vwap.time.window.start.hour.utc=21
crypto.vwap.time.window.end.hour.utc=23

# CryptoShortIntradayStrategy mirror params (defaults match the LONG breakout)
crypto.short.range.bars=24
crypto.short.min.range.width.pct=1.5
crypto.short.trend.period=96
crypto.short.atr.stop.mult=1.5
crypto.short.atr.trail.mult=2.5
crypto.short.max.bars.held=96

# CryptoEMACross strategies
crypto.emacross.ema.fast=9
crypto.emacross.ema.slow=21
crypto.emacross.rsi.period=7
crypto.emacross.max.bars.held=32

# ── Live trading ─────────────────────────────────────────────────────────────
# Safety: live orders are OFF by default; enable manually via
# POST /api/crypto/live-trading/enable or set to true here.
crypto.live.trading.enabled=false
# Position size = equity * position.pct.of.equity, clamped to [position.min.eur, max.position.eur].
# Equity = EUR cash balance + cost basis of currently open positions, so sizing scales with account growth/drawdown.
crypto.live.trading.position.pct.of.equity=0.07
crypto.live.trading.position.min.eur=25
crypto.live.trading.max.position.eur=500
crypto.live.trading.max.daily.loss.eur=2000
# Total EUR deployed across all open positions must not exceed this fraction of equity.
crypto.live.trading.max.total.exposure.pct=0.5
# Signal-strength position scaling: a rule-based confidence tier computed per strategy
# (see ISignalStrength) multiplies the base position.pct.of.equity above before the
# min/max clamp applies — a STRONG signal never bypasses max.position.eur, it just
# reaches it sooner. BASE (the default when a strategy doesn't implement ISignalStrength,
# or on a plain pass with no bonus conditions met) always multiplies by 1.
# Deliberately a fixed multiplier, not Kelly sizing — see RESEARCH_intraday_edge_search_2026-08.md
# for why a calibrated win-probability isn't trustworthy yet on this project's trade counts.
crypto.signal.strength.elevated.multiplier=1.5
crypto.signal.strength.strong.multiplier=2.0

# Paper trading: simulates fills for every BUY/SELL signal regardless of the live-trading
# switch above, using one shared account across all strategies. Sizing mirrors live trading
# (crypto.live.trading.position.pct.of.equity/min/max/max.total.exposure.pct) but against this
# account's own simulated equity, not the real Coinbase balance.
crypto.paper.trading.init.capital.eur=2000
# Max open exposure in ONE ticker across all strategies (fraction of equity). A BUY is
# scaled down to fit and skipped below position.min.eur. Added 2026-10-07 after TRAC-USD
# sat in two strategies at once (~14% of the account). LiveTradingGate reads the same key
# (paper and live stay in sync), so this caps live orders too.
crypto.paper.trading.max.ticker.exposure.pct=0.10
# Fractional-Kelly sizing (KellyPositionSizingService, 2026-10-16): replaces
# crypto.live.trading.position.pct.of.equity with 0.25 x f* per strategy, from its last
# 100 closed paper trades, clamped to 0.5%-5% of equity; 2% below min.trades. Signal-
# strength multipliers and the min/max EUR clamp still apply on top. Paper AND live read
# these keys (LiveTradingGate) — not set for kraken-futures, which keeps fixed sizing.
crypto.kelly.sizing.enabled=true
crypto.kelly.min.trades=20

# CryptoShort and CryptoEMACrossShort: Coinbase does not support short selling, so
# these can generate SHRT/COVR signals for review but CryptoIntradayStrategyRunner's
# paper-trading path still skips them (see its class-level comment) — no broker to
# execute against. Re-enabled 2026-08-28 at the user's request to keep the signals
# visible while a suitable broker/venue is still being sought; revisit fully once
# perpetuals/futures (or another shorting-capable venue) becomes available.
# NOTE: CryptoShort had the best gross edge in the whole dataset (+0.869%/trade,
# 52.5% win, n=59 in June). CryptoEMACrossShort has no equivalent documented edge
# study — it was grouped here only for the same spot-shorting constraint.
crypto.short.enabled=true
crypto.emacrossshort.enabled=true

# ── Disabled 2026-07-31 after reviewing all 2566 round trips ──────────────────
# Both had NEGATIVE GROSS edge — they lose before a single cent of fees, so no
# fee tier or venue change rescues them (measured 2026-07-20..07-31):
#   EMACrossLong   -0.461%/trade gross, 19.0% win rate, 1040 trades, no stop loss
#   RangeBreakout  -0.434%/trade gross, 25.7% win rate,  444 trades
# Both were REMOVED from the codebase 2026-10-05: neither entry has predictive
# content even in a TRENDING_UP month (forward returns equal or trail an all-bars
# baseline; RangeBreakout fails back under the broken level within 1h in 55% of
# cases). See docs/research/coinbase-strategy-review-2026-10.md.
# VWAPReversion stays on: +0.285%/trade gross, the only strategy with a real edge.

# Per-strategy asset exclusions (comma-separated product IDs)
# ETH-EUR excluded from VWAPReversion: only loser in otherwise clean strategy (-3.88% all-time)
crypto.vwap.excluded.products=ETH-EUR

# Excluded from ALL crypto intraday strategies (2026-08-26 performance review — all 13
# net losers across the board). Does NOT apply to CryptoLiquiditySweepIntradayStrategy:
# its product universe is locked by the PREREG_liquidity_sweep_15m.md pre-registration,
# see the note on crypto.intraday.products above.
crypto.excluded.products=JASMY-USD,SNX-EUR,ALGO-EUR,DOGE-EUR,UNI-EUR,LINK-EUR,AVAX-EUR,CHZ-EUR,ONDO-USD,GRT-EUR,ETC-EUR,BAT-EUR,USELESS-USD

# ── PDH/PDL liquidity sweep ───────────────────────────────────────────────────
# Implements ~/itark/PREREG_liquidity_sweep_15m.md (written 2026-08-04, before the
# data to evaluate it existed). Enabled to ACCUMULATE FORWARD DATA — it is not a
# validated strategy and nothing here should be read as a claim that it works.
#
# DO NOT inspect its paper P&L before the data gate in §2 of that document is met
# (day-clustered SE <= 0.25pp AND >= 120 distinct UTC days; ~December 2026 at
# current accumulation). Checking at day 60 and again at day 120 is two tests, and
# the second is no longer pre-registered.
#
# DO NOT tune these parameters. They are §4-§5 of the pre-registration. Any change
# must go in the deviation log in §10 and relabels the test exploratory.
#
# NOTE: changing crypto.intraday.products above invalidates the pre-registration —
# 15m bar collection follows that list, so added products get shorter history and
# removed ones create survivorship.
crypto.sweep.enabled=true
crypto.sweep.confirm.bars=4
crypto.sweep.min.range.pct=2.0
crypto.sweep.max.bars.held=96

# ── Level2 order-book capture (data gate for ~/itark/PREREG_ofi_1m.md) ────────
# Off by default — this opens a persistent outbound WebSocket to Coinbase using
# the same exchange.key/exchange.secret credentials as live trading (read-only:
# it only subscribes to public market-data channels, no order capability is
# exercised). Enable explicitly, and only after understanding it starts an
# always-on connection, not a one-off sync.
#
# Universe is LOCKED to PREREG_ofi_1m.md §3 (BTC-EUR, ETH-EUR) — do not widen
# to the full crypto.intraday.products list without a new pre-registration;
# see that document for why (liquidity, tick-floor artifacts on thin products).
coinbase.l2.capture.enabled=true
coinbase.l2.capture.products=BTC-EUR,ETH-EUR
# Comfortably above the pre-registration's Gate B (20 days) so re-running the
# analysis after the gate is met doesn't require a fresh capture window.
coinbase.l2.capture.retention.days=35

# Gate A FAIL 2026-09-09, §7b — retired.
# Full result: t=0.219 (need >2.5), split-halves opposite sign, net mean
# -0.2008% after cost, cost=93.5% of the gross winning-side move. 3 of 4
# §9 criteria failed. Per §7b's pre-committed consequence: "OFI should be
# retired as a candidate here — not re-parameterized a third time."
# L2 capture (above) stays ON — this only stops the strategy from evaluating
# signals and dispatching trades; the pre-registration's data record is
# otherwise left intact.
orderflow.imbalance.enabled=false

# GARCH volatility regime: equity-only pilot for now (steg 1). Explicit here
# even though the base default is already false — crypto is untouched until
# the equity pilot is evaluated.
regime.garch.enabled=false

# Prophet daily-PnL forecast: equity-only pilot for now (steg 2). Explicit
# here even though the base default is already false.
forecast.prophet.enabled=false

# LSTM signal filter (steg 2) — its only always-on consumers (EMACrossLong,
# RangeBreakout) were removed 2026-10-05, so it is OFF.
# CryptoVWAPReversionIntradayStrategy's own opt-in (crypto.vwap.lstm.filter.enabled)
# ALSO requires this flag: set it back to true together with that switch, with an
# LSTM service running on port 8090, when measuring the filter on VWAP.
forecast.lstm.enabled=false

# Coinbase taker round trip (0.1%/leg x2) — explicit here even though it
# matches the pre-existing exchange.transaction.cryptoTakerFeePerTradePercent
# default, so TransactionFeeService's per-profile override is unambiguous.
# See TransactionFeeService class javadoc: this is the ONLY fee source shared
# by crypto and kraken-futures for CryptoIntradayStrategy-tagged strategies
# (BarSeriesService backtests, PortfolioService, DataController) — it does
# NOT affect CryptoPaperTradingService's own live-fill fee (same property,
# already correct here).
trading.fee.roundtrip.pct=0.002

# ── BTCTrendFollower (daily BTC-EUR trend signal) ────────────────────────────
# Manual-execution signal: user holds BULL BITCOIN X2 AVA on LONG, BEAR BITCOIN
# X2 AVA on SHORT, cash on NEUTRAL. Computed by CryptoBtcTrendSignalService from
# the daily BTC-EUR OHLCV series in security_price (synced from Coinbase
# Advanced Trade daily candles by the 00:30 job — no Yahoo). EMA10/EMA20
# crossover with an ADX(14)>20 trend filter; ADX below the threshold = NEUTRAL.
# The ta4j long leg (CryptoBTCTrendStrategy) is registered in StrategiesMap for
# backtest metrics but excluded from the daily batch run above (BTC-only).
# GET /crypto/btc-trend-signal returns the current signal for the dashboard.
scheduler.crypto.btctrend.cron=0 35 0 * * *
crypto.btctrend.product=BTC-EUR
crypto.btctrend.ema.fast=10
crypto.btctrend.ema.slow=20
crypto.btctrend.adx.period=14
crypto.btctrend.adx.threshold=20.0
