# ========================================
# Equity profile — Yahoo/OMX data on port 8080
# Start: mvn spring-boot:run -Dspring-boot.run.profiles=equity
# ========================================

server.port=8080

spring.datasource.url=jdbc:h2:file:~/itark/froskH2DBFile;AUTO_SERVER=TRUE

frosk.adddatasetandsecurities=true
frosk.addsecuritypricesfromcoinbase=false
frosk.addsecuritypricesfromyahoo=true
frosk.updatesecuritymetadata=true
frosk.runallstrategies=true
frosk.buildportfolio=true
frosk.updatehedgeindex=true
frosk.database.only=YAHOO

# Rebuild the daily portfolio snapshot on every build() call instead of once per day.
# HighLander.runInstall() now builds the snapshot AFTER Månadsportföljen runs, but a
# snapshot may already exist for today (Tier 1 at 18:00, or an earlier restart) — the
# per-day idempotency would then skip the rebuild and today's fresh SLMS signals would
# not land until Saturday's Tier 2. Forcing the rebuild keeps the snapshot in step with
# the latest FeaturedStrategy state. Cost: a few extra snapshot rows on days with
# multiple restarts; the dashboard already sorts by date and hides empty ones.
frosk.portfolio.force.rebuild=true

frosk.run.omxs30swing=true
frosk.run.dagstrategin=true
frosk.run.manedsportfolj=true
# Equity intraday is not in use — no 15m Yahoo bar sync, no intraday strategy run.
# frosk.run.intraday=false short-circuits HighLander.syncTier0() (also the manual
# /syncTier0 endpoint); scheduler.tier0.cron=- stops the every-10-min no-op firing.
frosk.run.intraday=false
scheduler.tier0.cron=-
frosk.run.crypto=false
