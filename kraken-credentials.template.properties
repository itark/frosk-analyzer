# Template for the local Kraken Futures API credentials file.
# This template IS checked into git (no real values in it). The actual file is NOT.
#
# Setup (one-time, per machine that runs the kraken-futures profile):
#   mkdir -p ~/.frosk
#   cp kraken-credentials.template.properties ~/.frosk/kraken-credentials.properties
#   chmod 600 ~/.frosk/kraken-credentials.properties
#   # then edit ~/.frosk/kraken-credentials.properties and fill in real values
#
# ~/.frosk/ lives outside this repo, so it can never be committed by accident.
# application-kraken-futures.properties loads it via spring.config.import
# (optional: — startup still works if the file isn't there).
#
# Obtain a key: https://futures.kraken.com → Settings → API Keys
# A read-only key is enough while crypto.live.trading.enabled=false.
#
# Alternative to this file: set the KRAKEN_FUTURES_API_KEY / KRAKEN_FUTURES_API_SECRET
# environment variables instead (useful for CI or a container deployment where
# there's no home directory to drop a file into). Either source works; the file
# takes precedence if both are set.

kraken.futures.api.key=YOUR_KRAKEN_FUTURES_API_KEY
kraken.futures.api.secret=YOUR_KRAKEN_FUTURES_API_SECRET
